apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-executor
  namespace: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-executor
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-platform-alerts
  namespace: observability
spec:
  groups:
    - name: agent-platform
      rules:
        - alert: AgentJobQueueWaitHigh
          expr: histogram_quantile(0.95, sum(rate(agent_job_queue_wait_seconds_bucket[10m])) by (le, tenant_id)) > 300
          for: 15m
          labels:
            severity: page
          annotations:
            summary: Agent jobs are waiting more than five minutes
            runbook_url: https://github.com/rahulbhatia-rb/emergent-agent-platform-ops-reference/blob/main/runbooks/stuck-agent-job.md
        - alert: AgentRunCostAnomaly
          expr: sum(rate(agent_run_cost_dollars_total[1h])) by (tenant_id, project_id) > 2 * avg_over_time(sum(rate(agent_run_cost_dollars_total[1h])) by (tenant_id, project_id)[7d:1h])
          for: 30m
          labels:
            severity: ticket
          annotations:
            summary: Agent workload cost is outside its normal range
